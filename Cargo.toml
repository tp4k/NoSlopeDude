[package]
name = "nsd"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "nsd"
path = "src/lib.rs"

[[bin]]
name = "nsd"
path = "src/main.rs"

[dependencies]
tree-sitter = "0.27.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
ignore = "0.4.33"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rayon = "1.12.0"
tempfile = "3.27.0"
anyhow = "1.0.104"
blake3 = "1.8.7"
tree-sitter-java-orchard = "0.5.18"
