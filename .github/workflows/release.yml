# Publishes a static Linux binary for each `v*` tag. Consumers such as a CI
# job download `nsd-x86_64-unknown-linux-musl.tar.gz` from the release and
# verify it against a pinned checksum. The tag must match the version in
# Cargo.toml. Every pull request and every push to main runs the `build` job,
# so a change that breaks the musl build fails before it is tagged. Only the
# `publish` job holds a write token, it runs only for a tag, and it runs no
# code from the checkout: it uploads the artifact the `build` job produced.
name: release

on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
      ASSET: nsd-x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag matches Cargo.toml
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "nsd") | .version')"
          test "$TAG" = "v$VERSION" || { echo "tag $TAG does not match Cargo.toml version $VERSION"; exit 1; }
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add "$TARGET"
      - name: Test
        run: cargo test --locked --target "$TARGET"
      - name: Build
        run: cargo build --locked --release --target "$TARGET"
      - name: Smoke run
        run: |
          BIN="target/$TARGET/release/nsd"
          file "$BIN" | tee /dev/stderr | grep -q 'statically linked\|static-pie linked'
          "$BIN" --help > /dev/null
          "$BIN" check --base HEAD
      - name: Package
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/nsd" LICENSE dist/
          tar -C dist -czf "$ASSET.tar.gz" nsd LICENSE
          sha256sum "$ASSET.tar.gz" > "$ASSET.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-asset
          path: |
            ${{ env.ASSET }}.tar.gz
            ${{ env.ASSET }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ASSET: nsd-x86_64-unknown-linux-musl
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-asset
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes "Static Linux binary for $TAG."
          fi
          gh release upload "$TAG" "$ASSET.tar.gz" "$ASSET.tar.gz.sha256" --clobber
          gh release edit "$TAG" --draft=false
