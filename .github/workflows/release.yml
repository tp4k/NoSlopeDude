# Publishes a static Linux binary for each `v*` tag. Consumers such as a CI
# job download `nsd-x86_64-unknown-linux-musl.tar.gz` from the release and
# verify it against the `.sha256` file published next to it. The tag must
# match the version in Cargo.toml. A pull request that edits this file runs
# every step except the tag check and the publish.
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [.github/workflows/release.yml]

permissions:
  contents: write

jobs:
  linux-musl:
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
      ASSET: nsd-x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag matches Cargo.toml
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "nsd") | .version')"
          test "$TAG" = "v$VERSION" || { echo "tag $TAG does not match Cargo.toml version $VERSION"; exit 1; }
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add "$TARGET"
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --locked --release --target "$TARGET"
      - name: Smoke run
        run: |
          BIN="target/$TARGET/release/nsd"
          file "$BIN"
          "$BIN" check --base HEAD~1
      - name: Package
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/nsd" LICENSE dist/
          tar -C dist -czf "$ASSET.tar.gz" nsd LICENSE
          sha256sum "$ASSET.tar.gz" > "$ASSET.tar.gz.sha256"
      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "$ASSET.tar.gz" "$ASSET.tar.gz.sha256" --title "$TAG" --notes "Static Linux binary for $TAG."
